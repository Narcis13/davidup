<?xml version="1.0" encoding="UTF-8"?>
<!-- Bit, the little computer of how-ai-learns: a monitor head on a boxy body, a screen face (eyes, brows, four
     mouths, cheeks), three dials on its chest that turn (dial-1 .. dial-3, the "tiny dials" of training), an
     antenna that lags the head (data-follow) with a bulb that lights (bulb: off | on), two short arms with mitts
     and a socket in each, two feet. Front view only. Drawn by hand in the Figma conventions; import:
     hdf svg assets/src/bit.svg --name bit --licence own --roles assets/src/bit.roles.json -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-178 -382 356 394" width="356" height="394" data-units="334" data-desc="Bit, a little computer that learns: a screen face with nine eyes (open happy sleep wide half wink x star off), four mouths and brows; three dials on its chest; an antenna that follows, its bulb off or on; short arms, a socket in each mitt">
